
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DERİNDENİZBALIKÇISI</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#031b2c;color:white;font-family:Arial;
 touch-action:none;user-select:none;
}
canvas.game3d{
 position:fixed;inset:0;width:100%;height:100%;z-index:0;
}
#menu{
 position:fixed;inset:0;z-index:10;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;
 background:linear-gradient(160deg,#087eae,#03213d 75%);
}
#menu h1{font-size:clamp(24px,5vw,42px);color:#7deaff}
#menu p{color:#d0f5ff}
.menu-btn{
 width:min(270px,80vw);padding:14px;margin:6px;
 border:1px solid #73e5ff;border-radius:13px;
 color:white;background:linear-gradient(120deg,#078bb8,#07527e);
 font-size:16px;font-weight:bold;
}
#hud{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#status{
 position:absolute;top:12px;left:50%;transform:translateX(-50%);
 padding:8px 15px;border-radius:20px;
 background:#001d35bb;font-size:13px;white-space:nowrap;
}
#camera{
 position:absolute;right:max(14px,env(safe-area-inset-right));
 top:max(14px,env(safe-area-inset-top));
 width:52px;height:52px;border-radius:50%;
 border:2px solid #b8f4ff;background:#075b85;color:white;
 font-size:24px;pointer-events:auto;
}
#minimap{
 position:absolute;left:max(12px,env(safe-area-inset-left));
 top:max(12px,env(safe-area-inset-top));
 width:clamp(95px,18vw,145px);
 aspect-ratio:1;border-radius:50%;
 border:3px solid #a8efff;background:#052b40;
 box-shadow:0 0 12px #00bfff88;
}
#mapCanvas{width:100%;height:100%;display:block;border-radius:50%}
#speedBox{
 position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
 background:#001d35cc;border:1px solid #6ce5ff;
 padding:7px 15px;border-radius:20px;font-size:13px;
}
#steering{
 position:absolute;left:max(20px,env(safe-area-inset-left));
 bottom:max(18px,env(safe-area-inset-bottom));
 width:clamp(105px,19vw,145px);
 aspect-ratio:1;border:10px solid #d9f8ff;
 border-radius:50%;background:#073c59aa;
 box-shadow:0 0 10px #00cfff99;
 pointer-events:auto;touch-action:none;
}
#steering:before,#steering:after{
 content:"";position:absolute;background:#d9f8ff;
 left:8%;right:8%;top:calc(50% - 4px);height:8px;
 border-radius:5px;
}
#steering:after{transform:rotate(90deg)}
#wheelCenter{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:23px;height:23px;border-radius:50%;background:#d9f8ff;
}
#throttle{
 position:absolute;right:max(22px,env(safe-area-inset-right));
 bottom:max(18px,env(safe-area-inset-bottom));
 height:clamp(125px,26vh,180px);width:65px;
 border-radius:30px;background:#062c46dd;
 border:3px solid #c4f3ff;pointer-events:auto;
 touch-action:none;
}
#throttle:before{
 content:"▲";position:absolute;top:5px;left:22px;color:#70eaff;
 font-size:15px;
}
#throttle:after{
 content:"▼";position:absolute;bottom:5px;left:22px;color:#70eaff;
 font-size:15px;
}
#lever{
 position:absolute;left:5px;top:50%;
 transform:translateY(-50%);
 width:49px;height:35px;border-radius:20px;
 background:linear-gradient(135deg,#8df2ff,#078cbd);
 border:2px solid white;box-shadow:0 2px 8px #0008;
}
#rotateNotice{
 display:none;position:fixed;inset:0;z-index:30;
 background:#031b2c;color:white;
 align-items:center;justify-content:center;
 text-align:center;font-size:20px;padding:25px;
}
@media (orientation:portrait){
 #rotateNotice{display:flex}
}
</style>
</head>

<body>
<div id="menu">
 <h1>🎣 DERİNDENİZBALIKÇISI</h1>
 <p>Denizin derinliklerinde macera başlıyor!</p>
 <button class="menu-btn" onclick="startGame()">▶ OYUNA BAŞLA</button>
 <button class="menu-btn">🚤 TEKNE GARAJI</button>
 <button class="menu-btn">🐟 BALIK KOLEKSİYONU</button>
 <button class="menu-btn">⚙ AYARLAR</button>
</div>

<div id="hud">
 <div id="minimap"><canvas id="mapCanvas" width="220" height="220"></canvas></div>
 <div id="status">🎣 DERİNDENİZBALIKÇISI</div>
 <button id="camera" onclick="changeCamera()">📷</button>
 <div id="steering"><div id="wheelCenter"></div></div>
 <div id="throttle"><div id="lever"></div></div>
 <div id="speedBox">0 KM/H</div>
</div>

<div id="rotateNotice">📱 Oyunu oynamak için telefonunu yatay çevir!</div>

<script type="module" src="./js/game.js"></script>
</body>
</html>
