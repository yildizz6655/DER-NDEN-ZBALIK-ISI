
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERİNDENİZBALIKÇISI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game"></div>

<div id="menu">
    <h1>🎣 DERİNDENİZBALIKÇISI</h1>
    <p>Denizin derinliklerinde macera başlıyor!</p>

    <button onclick="startGame()">▶ OYUNA BAŞLA</button>
    <button onclick="openPanel('garage')">🚤 TEKNE GARAJI</button>
    <button onclick="openPanel('collection')">🐟 BALIK KOLEKSİYONU</button>
    <button onclick="openPanel('settings')">⚙ AYARLAR</button>

    <div>💰 <span id="menu-money">1.000</span> TL</div>
</div>

<div id="garage" class="screen">
    <h1>🚤 TEKNE GARAJI</h1>
    <p>Başlangıç teknen seni bekliyor!</p>
    <button onclick="backMenu()">GERİ</button>
</div>

<div id="collection" class="screen">
    <h1>🐟 BALIK KOLEKSİYONU</h1>
    <p>Henüz balık yakalamadın.</p>
    <button onclick="backMenu()">GERİ</button>
</div>

<div id="settings" class="screen">
    <h1>⚙ AYARLAR</h1>
    <p>Oyun sürümü: 1.0</p>
    <button onclick="backMenu()">GERİ</button>
</div>

<div id="hud">
    <div class="top-info">
        <b>🎣 DERİNDENİZBALIKÇISI</b>
        <span>💰 1.000 TL</span>
        <span id="speed">0 KM/H</span>
    </div>

    <button id="camera">📷 KAMERA</button>

    <div id="controls">
        <div class="steering-area">
            <div id="steering-wheel">
                <div class="wheel-center">✥</div>
            </div>
            <small>DİREKSİYON</small>
        </div>

        <div class="throttle-area">
            <div id="throttle">
                <div class="lever-label top">İLERİ</div>
                <div class="lever-label bottom">GERİ</div>
                <div id="throttle-handle"></div>
            </div>
            <small>GAZ / GERİ</small>
        </div>
    </div>
</div>

<script>
function openPanel(id) {
    document.getElementById("menu").style.display = "none";
    document.getElementById(id).style.display = "flex";
}

function backMenu() {
    document.querySelectorAll(".screen").forEach(el => {
        el.style.display = "none";
    });
    document.getElementById("menu").style.display = "flex";
}
</script>

<script type="module" src="./js/game.js"></script>
</body>
</html>
