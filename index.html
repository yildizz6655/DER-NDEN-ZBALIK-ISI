
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#061d30">

    <title>DERİNDENİZBALIKÇISI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #061d30;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        .game3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ANA MENÜ */
        #menu {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background:
                linear-gradient(#001d30aa, #001020ee),
                linear-gradient(135deg, #087ca8, #021827);
        }

        #menu h1 {
            font-size: clamp(28px, 6vw, 55px);
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px #000;
        }

        #menu p {
            color: #b8eaff;
            margin-bottom: 30px;
            font-size: 15px;
        }

        #menu button {
            padding: 17px 55px;
            border: 2px solid white;
            border-radius: 12px;
            background: #0788bd;
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 20px #0008;
        }

        /* OYUN ARAYÜZÜ */
        #hud {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* MİNİ HARİTA */
        #minimap {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 125px;
            height: 125px;
            border: 3px solid white;
            border-radius: 50%;
            overflow: hidden;
            background: #07516d;
            box-shadow: 0 3px 12px #0009;
        }

        #mapCanvas {
            width: 100%;
            height: 100%;
        }

        /* KAMERA */
        #camera {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 55px;
            height: 55px;
            border: 2px solid white;
            border-radius: 15px;
            background: #071d30dd;
            color: white;
            font-size: 26px;
            pointer-events: auto;
        }

        /* HIZ GÖSTERGESİ */
        #speedBox {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: #001b2ccc;
            border: 1px solid #ffffff88;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 17px;
            font-weight: bold;
        }

        /* DİREKSİYON */
        #steering {
            position: absolute;
            bottom: 22px;
            left: 25px;
            width: 125px;
            height: 125px;
            border: 10px solid #222;
            border-radius: 50%;
            background:
                radial-gradient(circle, #555 0 18%, #111 20% 30%, #444 32% 100%);
            box-shadow: 0 5px 15px #000a;
            pointer-events: auto;
            touch-action: none;
        }

        #steering::before,
        #steering::after {
            content: "";
            position: absolute;
            background: #ddd;
            border-radius: 5px;
        }

        #steering::before {
            width: 75%;
            height: 9px;
            top: 50%;
            left: 12.5%;
            transform: translateY(-50%);
        }

        #steering::after {
            width: 9px;
            height: 75%;
            left: 50%;
            top: 12.5%;
            transform: translateX(-50%);
        }

        /* GAZ KOLU */
        #throttle {
            position: absolute;
            right: 25px;
            bottom: 20px;
            width: 75px;
            height: 175px;
            border: 4px solid #aaa;
            border-radius: 20px;
            background: #101b28dd;
            pointer-events: auto;
            touch-action: none;
        }

        #throttle::before {
            content: "GAZ";
            position: absolute;
            top: 8px;
            width: 100%;
            text-align: center;
            color: #53e9a4;
            font-size: 11px;
            font-weight: bold;
        }

        #throttle::after {
            content: "GERİ";
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            color: #ff7777;
            font-size: 11px;
            font-weight: bold;
        }

        #lever {
            position: absolute;
            top: 50%;
            left: 8px;
            width: 50px;
            height: 42px;
            transform: translateY(-50%);
            border-radius: 12px;
            border: 2px solid white;
            background: linear-gradient(#55caff, #0875a7);
            box-shadow: 0 3px 8px #0009;
        }

        /* DİKEY EKRAN UYARISI */
        #rotateNotice {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #061d30;
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 22px;
            padding: 25px;
        }

        @media (orientation: portrait) {
            #rotateNotice {
                display: flex;
            }
        }

        @media (max-height: 450px) {
            #steering {
                width: 105px;
                height: 105px;
                bottom: 12px;
            }

            #throttle {
                height: 145px;
                bottom: 10px;
            }

            #minimap {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <!-- ANA MENÜ -->
    <div id="menu">
        <h1>DERİNDENİZBALIKÇISI</h1>
        <p>3D Balıkçılık Macerası</p>
        <button onclick="startGame()">OYUNA BAŞLA</button>
    </div>

    <!-- OYUN ARAYÜZÜ -->
    <div id="hud">

        <div id="minimap">
            <canvas id="mapCanvas"
                width="250"
                height="250"></canvas>
        </div>

        <div id="speedBox">0 KM/H</div>

        <button id="camera"
            onclick="changeCamera()">📷</button>

        <div id="steering"></div>

        <div id="throttle">
            <div id="lever"></div>
        </div>

    </div>

    <!-- TELEFONU YATAY ÇEVİR -->
    <div id="rotateNotice">
        📱<br><br>
        Lütfen telefonunu yatay çevir!
    </div>

    <!-- OYUN JAVASCRIPT -->
    <script type="module" src="./js/game.js"></script>

</body>
</html>
